<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rosana Beling Advocacia</title>
    <!-- Single Page Apps for GitHub Pages (Redirecionador SPA 404) -->
    <!-- https://github.com/rafgraph/spa-github-pages -->
    <script type="text/javascript">
      // Número de segmentos do caminho a manter como base.
      // 1 para repositório do GitHub Pages (ex: /Site_rosana/)
      // 0 para domínio personalizado na raiz (ex: https://meudominio.com.br/)
      var pathSegmentsToKeep = window.location.hostname.endsWith('github.io') ? 1 : 0;

      var l = window.location;
      var repoPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var routePath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      var search = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoPath + '/?/' +
        routePath +
        search +
        l.hash
      );
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 40px; background-color: #F8F5F0; color: #211C19;">
    <p>Redirecionando para a aplicação...</p>
    <noscript>
      <p>O JavaScript está desativado. <a href="./">Clique aqui para ir à página inicial</a>.</p>
    </noscript>
  </body>
</html>
