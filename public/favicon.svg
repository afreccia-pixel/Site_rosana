<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="112" fill="#0B1221"/>
  <!-- Gold Border Ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#C5A059" stroke-width="12" stroke-opacity="0.6"/>
  <!-- Scale of Justice / Monogram Icon in Gold -->
  <g transform="translate(106, 96) scale(0.6)" fill="#C5A059">
    <!-- Pillar -->
    <rect x="236" y="80" width="28" height="320" rx="6"/>
    <!-- Base -->
    <path d="M140 400 h220 a10 10 0 0 1 10 10 v18 a10 10 0 0 1 -10 10 h-220 a10 10 0 0 1 -10 -10 v-18 a10 10 0 0 1 10 -10 Z"/>
    <!-- Top Finial -->
    <circle cx="250" cy="60" r="26"/>
    <!-- Beam -->
    <path d="M60 140 h380 a10 10 0 0 1 10 10 v8 a10 10 0 0 1 -10 10 h-380 a10 10 0 0 1 -10 -10 v-8 a10 10 0 0 1 10 -10 Z"/>
    <!-- Left Scale strings -->
    <line x1="80" y1="168" x2="30" y2="280" stroke="#C5A059" stroke-width="10"/>
    <line x1="80" y1="168" x2="130" y2="280" stroke="#C5A059" stroke-width="10"/>
    <!-- Left Scale Plate -->
    <path d="M 20 280 Q 80 330 140 280 Z"/>
    <!-- Right Scale strings -->
    <line x1="420" y1="168" x2="370" y2="280" stroke="#C5A059" stroke-width="10"/>
    <line x1="420" y1="168" x2="470" y2="280" stroke="#C5A059" stroke-width="10"/>
    <!-- Right Scale Plate -->
    <path d="M 360 280 Q 420 330 480 280 Z"/>
  </g>
</svg>
